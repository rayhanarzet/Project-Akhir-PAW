<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="menu2.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Shop - jippy</title>
</head>

<body>

  <!-- HEADER -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
      <img src="assets/LOGO.png" alt="Jippy" class="w-[64px] h-[64px]">
      <nav class="flex gap-10 items-center">
        <a href="menu.html" class="bg-[#FDE7A1] px-4 py-1 rounded-lg font-medium border border-black">Dashboard</a>
        <a href="preorder.html" class="text-black font-medium hover:bg-[#fff2c9] px-4 py-1 rounded-lg">Pre-Order</a>
        <a href="#" class="text-black font-medium hover:bg-[#fff2c9] px-4 py-1 rounded-lg">My Order</a>
        <a href="#" class="text-black font-medium hover:bg-[#fff2c9] px-4 py-1 rounded-lg">Live Chat</a>
      </nav>
      <div class="flex gap-4 items-center">
        <button><img src="assets/notif.png" class="w-[22px]"></button>
        <button><img src="assets/profil.png" class="w-[24px]"></button>
      </div>
    </div>
  </header>

  <!-- HAMBURGER -->
  <div class="bottom-nav">
    <div class="hamburger" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- SIDEBAR (AUTO-FILLED BY JS) -->
  <div class="sidebar" id="sidebar">
    <button class="close-btn" onclick="toggleSidebar()">✕</button>

    <ul class="menu" id="kategori-sidebar">
      <!-- JS akan isi kategori & subkategori -->
    </ul>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-container">
    <input type="text" class="search-input" placeholder="Search product" />
    <img src="assets/search.png" alt="Search" class="search-icon" />
  </div>

  <!-- JUDUL HALAMAN -->
  <div class="category" id="category-title">All Products</div>

  <!-- PRODUCT GRID — AUTO-FILLED BY JS -->
  <div class="products-grid" id="produk-container">
      <!-- JS isi produk disini -->
  </div>

  <!-- FOOTER -->
  <footer class="bg-[#FF96B5] py-4">
    <div class="max-w-6xl mx-auto text-sm text-white">
      <div class="flex justify-between items-center">
        <div class="flex items-center py-4 space-x-4">
            <img src="assets/LOGO.png" class="w-[35px] h-[35px]">
            <p class="mt-4 text-xs">© Jippy 2025 - All Rights Reserved</p>
        </div>
        <div class="flex flex-col items-end space-y-3">
            <span class="flex gap-7 text-right text-md">
                <a href="#" class="hover:underline">Home</a>
                <a href="#" class="hover:underline">About Us</a>
                <a href="#" class="hover:underline">Contact Person</a>
            </span>
            <span class="flex gap-4 text-xs">
                <p>Terms of Use</p>
                <p>Privacy Policy</p>
                <p>Agreement</p>
            </span>
        </div>
      </div>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="menu2.js"></script>
  <script src="app.js"></script>

</body>
</html>
