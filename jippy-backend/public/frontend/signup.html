<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign up to JIPPY</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body style="background-image: url('assets/web 2.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
  <img src="assets/logo jippy.png" alt="JIPPY Logo" class="logo-fixed">
  <div class="container">
    <div class="login-section">
      <h1>Sign up to <strong>JIPPY</strong></h1>
      <form id="signup-form">
        <label for="fullname">Full name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <button type="submit" class="btn">Sign up</button>
        <p class="signup-text">
          Already have an account? 
          <a href="signin.html">Sign in</a>
        </p>
      </form>
    </div>
    <div class="image-section">
      <img src="assets/signin shopping.png" class="img-shopping" alt="shopping">
      <img src="assets/signin kantong belanja.png" class="img-bags" alt="bags">
      <img src="assets/signin diskon.png" class="img-tags" alt="tags">
      <img src="assets/signin tangan hp.png" class="img-phone" alt="phone">
    </div>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault(); // Mencegah reload halaman

      // 1. Ambil data input
      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // 2. Cek Password Match
      if (password !== confirmPassword) {
        alert('Password dan Confirm Password tidak sama!');
        return;
      }

      // 3. Siapkan paket data (Perhatikan bagian 'name')
      const formData = {
        name: fullname,      // <-- UBAH INI (Dulu 'fullname: fullname')
        email: email,
        password: password
      };

      try {
        // 4. Kirim ke Backend (Pastikan CMD php artisan serve menyala)
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          // SUKSES
          alert('Registrasi Berhasil! Silakan Login.');
          window.location.href = 'signin.html'; // Pindah ke halaman login
        } else {
          // GAGAL (Misal email kembar)
          console.log(result);
          // Tampilkan pesan error dari Laravel
          let pesan = 'Gagal daftar.';
          if (result.errors) {
             pesan += '\n' + Object.values(result.errors).flat().join('\n');
          }
          alert(pesan);
        }

      } catch (error) {
        console.error('Error:', error);
        alert('Gagal koneksi ke server. Pastikan terminal "php artisan serve" menyala!');
      }
    });
  </script>
  </script>
</body>
</html>
