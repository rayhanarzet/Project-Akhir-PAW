<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in to JIPPY</title>
  <link rel="stylesheet" href="signin.css" />
</head>

<body style="background-image: url('assets/web 2.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
  <img src="assets/logo jippy.png" alt="JIPPY Logo" class="logo-fixed">
  <div class="container">
    <div class="login-section">
      <h1>Sign in to <strong>JIPPY</strong></h1>
      <form id="signin-form">
        <label for="email">Email/Username:</label>
        <input type="text" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn">Sign in</button>
      </form>
      <p class="signup-text">Don’t have an account? <a href="signup.html">Sign up here</a></p>
    </div>
    <div class="image-section">
      <img src="assets/signin shopping.png" class="img-shopping" alt="shopping">
      <img src="assets/signin kantong belanja.png" class="img-bags" alt="bags">
      <img src="assets/signin diskon.png" class="img-tags" alt="tags">
      <img src="assets/signin tangan hp.png" class="img-phone" alt="phone">
    </div>
  </div>
  <script>
    document.getElementById('signin-form').addEventListener('submit', async function(e) {
      e.preventDefault(); // Tahan, jangan pindah halaman dulu

      // 1. Ambil data yang diketik user
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // 2. Bungkus data
      const formData = {
        email: email,
        password: password
      };

      try {
        // 3. Kirim ke Satpam (Backend) untuk dicek
        // Pastikan 'php artisan serve' sedang menyala di terminal!
        const response = await fetch('http://127.0.0.1:8000/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {

    alert('Login Berhasil! Selamat datang ' + result.data.name);

    // Simpan email & nama
    localStorage.setItem("user_email", result.data.email);
    localStorage.setItem("user_name", result.data.name);

    // Cek admin
    if (result.data.email === "admin@jippy.com") {
        localStorage.setItem("role", "admin");
window.location.href = "/admin/preorder";

    }
    else {
        localStorage.setItem("role", "user");
        window.location.href = "/frontend/menu.html";
    }
}
 else {
          // KUNCI TETAP TERTUTUP (Password Salah)
          alert(result.message); // Muncul pesan: "Email atau Password salah!"
          // Jangan ada window.location di sini
        }

      } catch (error) {
        console.error('Error:', error);
        alert('Gagal koneksi ke server. Cek apakah terminal backend nyala?');
      }
    });
  </script>
</body>

</html>
